# Ruff configuration for SDB
# https://docs.astral.sh/ruff/

# Exclude common directories
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

# Python version compatibility
target-version = "py310"

# Line length to match yapf/google style
line-length = 88

[lint]
# Enable basic linting rules - start conservatively
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]

# Ignore specific rules that conflict with existing style or are too strict
ignore = [
    "E501",  # line too long (handled by yapf)
]

[lint.per-file-ignores]
# Allow unused imports in __init__.py files (often used for re-exports)
"__init__.py" = ["F401"]

[format]
# Use double quotes (aligns with yapf Google style)
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"
